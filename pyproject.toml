[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isotopos"
version = "0.1.0"
description = "Identify and characterize terrestrial analog locations on Earth for Moon bases, Moon landing sites, and Mars exploration sites."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=2.1.0",
    "h3>=4.1.0",
]

[project.optional-dependencies]
etl = [
    "httpx>=0.27.0",
    "tifffile>=2024.0",
    "imagecodecs>=2024.0",
    "h5py>=3.10.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "tifffile>=2024.0",
    "imagecodecs>=2024.0",
    "h5py>=3.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
markers = [
    "full_earth: Full-Earth evaluation suite verifying geophysical fidelity, novelty mask, and <100ms latency across all Earth H3 cells",
]

[tool.coverage.run]
source = ["src/isotopos"]
omit = ["src/isotopos/static/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
src = ["src", "tests", "scripts"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["isotopos"]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
pythonVersion = "3.11"

